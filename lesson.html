<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081321"><title>درس تعليمي | أكاديمية علوم الأرصاد</title>
<style>
:root{--bg:#081321;--p:#102137;--line:#29445d;--txt:#edf6ff;--muted:#a9bfd2;--cyan:#42d6e8;--gold:#f4c45e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#173651,transparent 38%),var(--bg);color:var(--txt);font:17px/2 Tahoma,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px}.top,.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.hero,.content{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:22px;margin:15px 0}.eyebrow{color:var(--cyan);font-size:13px;font-weight:bold}.muted{color:var(--muted)}.block{padding:15px 0;border-bottom:1px solid var(--line)}.block:last-child{border:0}.formula{direction:ltr;text-align:center;font:22px/1.8 Georgia,serif;color:var(--gold);background:#091827;padding:15px;border-radius:10px;overflow:auto}.example,.callout{padding:13px;border-radius:10px;background:#091827;border-right:3px solid var(--cyan)}.callout{border-color:var(--gold)}img{max-width:100%;height:auto;border-radius:12px;display:block;margin:12px auto}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}.question{background:#091827;border:1px solid var(--line);padding:14px;border-radius:12px}.option{display:block;width:100%;text-align:right;margin:7px 0;padding:10px;border:1px solid var(--line);border-radius:9px;background:#102137;color:var(--txt);cursor:pointer}.correct{border-color:#55d6a0;color:#55d6a0}.wrong{border-color:#ff7777;color:#ffaaaa}.btn{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#142b42;color:var(--txt);text-decoration:none}.empty{padding:20px;background:#102137;border-radius:12px}.objectives{background:#0b1a2a;padding:12px 25px;border-radius:10px}.completion{background:#0b1a2a;border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}.completion button{border:1px solid var(--cyan);background:#123247;color:var(--txt);padding:10px 16px;border-radius:9px;cursor:pointer;font:inherit}.completion button:disabled{opacity:.65;cursor:default}.completion .status{color:var(--muted);font-size:14px;margin-top:8px}@media(max-width:600px){.wrap{padding:12px}.hero,.content{padding:16px}}
</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script></head><body><main class="wrap"><nav class="top"><b>أكاديمية علوم الأرصاد الجوية</b><a class="btn" href="index.html">العودة إلى المواد</a></nav><header class="hero"><div class="eyebrow" id="course"></div><h1 id="title">تحميل الدرس…</h1><p class="muted" id="summary"></p><div class="meta muted"><span id="duration"></span><span id="level"></span></div></header><section class="content" id="body"><p class="muted">جارٍ تحميل المحتوى…</p></section><section class="completion"><b>تقدمك الدراسي</b><p class="muted">أكمل الدرس بعد قراءة المحتوى وحل الأنشطة. سيُحفظ الإنجاز في حسابك ويمكنك متابعته من أي جهاز.</p><button id="completeLesson" type="button" disabled>إكمال الدرس</button><div class="status" id="completionStatus" role="status">جارٍ التحقق من الحساب…</div><p><a class="btn" href="account.html">عرض لوحة تقدم الطالب</a></p></section></main>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm";
import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from"./supabase-config.js";
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),saved=(()=>{try{return JSON.parse(localStorage.getItem("msa-supabase-config-v1")||"{}")}catch{return{}}})(),cfg={url:saved.url||SUPABASE_URL,key:saved.key||SUPABASE_PUBLISHABLE_KEY};let db=null,currentUser=null,currentLesson=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function videoUrl(raw){try{const u=new URL(raw);if(u.protocol!=="https:")return"";if(u.hostname==="youtu.be")return"https://www.youtube-nocookie.com/embed/"+u.pathname.slice(1);if(u.hostname.endsWith("youtube.com")){const id=u.searchParams.get("v")||u.pathname.split("/").filter(Boolean).pop();return id?"https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id):""}if(u.hostname==="vimeo.com")return"https://player.vimeo.com/video/"+u.pathname.split("/").filter(Boolean).pop();return""}catch{return""}}
function renderBlock(b,i){const t=b.type;let inner="";if(t==="heading")inner="<h2>"+esc(b.text)+"</h2>";else if(t==="text")inner="<p>"+esc(b.text).replace(/\n/g,"<br>")+"</p>";else if(t==="formula")inner='<div class="formula">\\[' + esc(b.text) + '\\]</div>';else if(t==="example")inner='<div class="example"><h3>'+esc(b.title||"مثال محلول")+'</h3><p>'+esc(b.text)+'</p><h4>الحل والتفسير</h4><p>'+esc(b.solution)+'</p></div>';else if(t==="image"){try{const u=new URL(b.url);if(u.protocol==="https:")inner='<figure><img loading="lazy" src="'+esc(u.href)+'" alt="'+esc(b.caption)+'"><figcaption class="muted">'+esc(b.caption)+'</figcaption></figure>'}catch{}}else if(t==="video"){const u=videoUrl(b.url);if(u)inner='<h3>'+esc(b.caption||"فيديو تعليمي")+'</h3><iframe loading="lazy" src="'+esc(u)+'" title="'+esc(b.caption||"فيديو تعليمي")+'" allowfullscreen></iframe>';else inner='<p class="muted">رابط الفيديو غير مدعوم. استخدم رابط YouTube أو Vimeo.</p>'}else if(t==="file"){try{const u=new URL(b.url);if(u.protocol==="https:")inner='<p><a class="btn" href="'+esc(u.href)+'" target="_blank" rel="noopener">فتح الملف</a></p>'}catch{}}else if(t==="callout")inner='<div class="callout">'+esc(b.text)+'</div>';else if(t==="list")inner="<ul>"+(b.items||[]).map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";else if(t==="table"){const rows=b.rows||[];inner="<table>"+rows.map((r,i)=>"<tr>"+r.map(c=>i===0?"<th>"+esc(c)+"</th>":"<td>"+esc(c)+"</td>").join("")+"</tr>").join("")+"</table>"}else if(t==="graph"){const pts=b.points||[];if(pts.length>1){const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys),px=x=>40+(x-xmin)/(xmax-xmin||1)*420,py=y=>220-(y-ymin)/(ymax-ymin||1)*180;inner="<svg viewBox=\"0 0 500 260\"><path d=\"M40 20 V220 H470\" stroke=\"#a9bfd2\" fill=\"none\"/><polyline points=\""+pts.map(p=>px(p[0])+","+py(p[1])).join(" ")+"\" stroke=\"#42d6e8\" stroke-width=\"3\" fill=\"none\"/></svg>"}}else if(t==="simulation"){inner="<div class='question'><h3>"+esc(b.title||"محاكاة الضغط مع الارتفاع")+"</h3><p>"+esc(b.text||"")+"</p><label>الارتفاع: <output data-altitude-value>0</output> متر<input type='range' min='0' max='10000' step='100' value='0' data-altitude></label><p>الضغط التقريبي: <b data-pressure-value>1013.25 hPa</b></p><small class='muted'>نموذج تعليمي مبسط وليس أداة تشغيلية.</small></div>"}else if(t==="question"){const opts=b.options||[];inner='<div class="question"><b>'+esc(b.question)+'</b><div>'+opts.map((x,j)=>'<button class="option" data-answer="'+j+'" data-correct="'+Number(j===Number(b.answer))+'">'+esc(x)+'</button>').join("")+'</div><p class="muted hidden" data-explanation>'+esc(b.explanation||"")+'</p></div>'}return inner?'<article class="block">'+inner+'</article>':""}
async function load(){if(!cfg.url||!cfg.key){$("body").innerHTML='<div class="empty">لم يتم إعداد اتصال قاعدة البيانات في هذا المتصفح. افتح استوديو التأليف وسجّل الدخول لإعداد الاتصال، ثم أعد فتح هذا الدرس.</div>';return}if(!params.get("course")||!params.get("lesson")){$("body").innerHTML='<div class="empty">رابط الدرس غير مكتمل.</div>';return}db=createClient(cfg.url,cfg.key);const{data:{user}}=await db.auth.getUser();currentUser=user||null;const{data,error}=await db.from("academy_courses").select("id,title,published").eq("id",params.get("course")).maybeSingle();if(error||!data||!data.published){$("body").innerHTML='<div class="empty">المادة غير موجودة أو لم يتم نشرها.</div>';return}const r=await db.from("academy_lessons").select("*").eq("course_id",data.id).eq("slug",params.get("lesson")).eq("published",true).maybeSingle();if(r.error||!r.data){$("body").innerHTML='<div class="empty">الدرس غير موجود أو لم يتم نشره.</div>';return}const l=r.data;currentLesson=l;$("course").textContent=data.title+(l.chapter_title?" · "+l.chapter_title:"");$("title").textContent=l.title;$("summary").textContent=l.summary||"";$("duration").textContent=(l.estimated_minutes||"—")+" دقيقة";$("level").textContent=(l.unit_title?l.unit_title+" · ":"")+({beginner:"مبتدئ",intermediate:"متوسط",advanced:"متقدم"}[l.level]||"");const goals=l.learning_objectives||[];let html=goals.length?'<section class="block"><h2>الأهداف التعليمية</h2><ul class="objectives">'+goals.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul></section>":"";html+=(l.content?.blocks||[]).map(renderBlock).join("");$("body").innerHTML=html||'<p class="muted">لم تتم إضافة محتوى لهذا الدرس بعد.</p>';if(window.renderMathInElement)renderMathInElement($("body"),{delimiters:[{left:"$",right:"$",display:true},{left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}],throwOnError:false})}

async function loadCompletionState(){const button=$("completeLesson"),status=$("completionStatus");if(!currentUser){button.disabled=false;status.textContent="سجّل الدخول أولاً لحفظ إنجازك. يمكنك إنشاء حساب مجاني من بوابة الطالب.";button.textContent="تسجيل الدخول لحفظ التقدم";return}const{data,error}=await db.from("academy_lesson_progress").select("completed").eq("user_id",currentUser.id).eq("lesson_id",currentLesson.id).maybeSingle();if(error){button.disabled=true;status.textContent="تعذر قراءة تقدم الدرس: "+error.message;return}if(data?.completed){button.disabled=true;button.textContent="تم إكمال هذا الدرس ✓";status.textContent="إنجازك محفوظ في حسابك."}else{button.disabled=false;status.textContent="لم يتم تسجيل إكمال هذا الدرس بعد."}}
$("completeLesson").addEventListener("click",async()=>{if(!currentUser){location.href="account.html";return}if(!currentLesson||!db)return;const button=$("completeLesson"),status=$("completionStatus");button.disabled=true;status.textContent="جارٍ حفظ تقدمك…";const{error}=await db.from("academy_lesson_progress").upsert({user_id:currentUser.id,lesson_id:currentLesson.id,completed:true,updated_at:new Date().toISOString()},{onConflict:"user_id,lesson_id"});if(error){button.disabled=false;status.textContent="لم يتم الحفظ: "+error.message;return}const check=await db.from("academy_lesson_progress").select("completed").eq("user_id",currentUser.id).eq("lesson_id",currentLesson.id).maybeSingle();if(check.error||!check.data?.completed){button.disabled=false;status.textContent="لم نستطع تأكيد حفظ الإنجاز. حاول مرة أخرى.";return}button.textContent="تم إكمال هذا الدرس ✓";status.textContent="تم حفظ الإنجاز بنجاح. سيظهر في لوحة تقدم الطالب."});
$("body").addEventListener("input",e=>{if(!e.target.matches("[data-altitude]"))return;const h=Number(e.target.value),p=1013.25*Math.pow(1-2.25577e-5*h,5.25588),box=e.target.closest(".question");box.querySelector("[data-altitude-value]").textContent=h.toLocaleString("en-US");box.querySelector("[data-pressure-value]").textContent=p.toFixed(1)+" hPa"});$("body").addEventListener("click",e=>{const b=e.target.closest("[data-answer]");if(!b)return;const group=b.parentElement;if(group.dataset.done)return;group.dataset.done="1";const ok=b.dataset.correct==="1";b.classList.add(ok?"correct":"wrong");if(!ok){const right=[...group.children].find(x=>x.dataset.correct==="1");right?.classList.add("correct")}const exp=b.closest(".question").querySelector("[data-explanation]");exp.classList.remove("hidden");exp.textContent=(ok?"إجابة صحيحة. ":"حاول مراجعة الشرح. ")+exp.textContent});
load().catch(e=>{$("body").innerHTML='<div class="empty">تعذر تحميل الدرس: '+esc(e.message)+'</div>'});
</script></body></html>
