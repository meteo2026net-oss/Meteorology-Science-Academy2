<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081321"><title>معاينة الدرس | أكاديمية علوم الأرصاد</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>:root{--bg:#081321;--p:#102137;--line:#29445d;--txt:#edf6ff;--muted:#a9bfd2;--cyan:#42d6e8;--gold:#f4c45e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#173651,transparent 38%),var(--bg);color:var(--txt);font:17px/2 Tahoma,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px}.hero,.content{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:22px;margin:15px 0}.muted{color:var(--muted)}.block{padding:15px 0;border-bottom:1px solid var(--line)}.formula{direction:ltr;text-align:center;color:var(--gold);background:#091827;padding:15px;border-radius:10px;overflow:auto}.example,.callout,.simulation{padding:13px;border-radius:10px;background:#091827;border-right:3px solid var(--cyan)}.callout{border-color:var(--gold)}img{max-width:100%;height:auto;border-radius:12px;display:block;margin:auto}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}table{width:100%;border-collapse:collapse}td,th{border:1px solid var(--line);padding:8px;text-align:right}.chart{width:100%;background:#091827;border-radius:12px}.btn,.option{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#142b42;color:var(--txt);text-decoration:none;cursor:pointer}.option{display:block;width:100%;text-align:right;margin:7px 0}.correct{border-color:#55d6a0;color:#55d6a0}.wrong{border-color:#ff7777;color:#ffaaaa}.muted{color:var(--muted)}input[type=range]{width:100%;accent-color:var(--cyan)}@media(max-width:600px){.wrap{padding:12px}.hero,.content{padding:16px}}</style></head><body><main class="wrap"><nav><a class="btn" href="editor.html">العودة إلى المحرر</a><b>معاينة قبل النشر</b></nav><header class="hero"><div class="muted">معاينة محلية — لا يتم نشر هذا المحتوى</div><h1 id="title">درس جديد</h1><p id="summary" class="muted"></p><div id="meta" class="muted"></div></header><section class="content" id="body"></section></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function videoUrl(raw){try{const u=new URL(raw);if(u.protocol!=="https:")return"";if(u.hostname==="youtu.be")return"https://www.youtube-nocookie.com/embed/"+u.pathname.slice(1);if(u.hostname.endsWith("youtube.com")){const id=u.searchParams.get("v")||u.pathname.split("/").filter(Boolean).pop();return id?"https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id):""}if(u.hostname==="vimeo.com")return"https://player.vimeo.com/video/"+u.pathname.split("/").filter(Boolean).pop();return""}catch{return""}}
function block(b){let h="",t=b.type;if(t==="heading")h="<h2>"+esc(b.text)+"</h2>";else if(t==="text")h="<p>"+esc(b.text).replace(/\n/g,"<br>")+"</p>";else if(t==="formula")h='<div class="formula">$$'+esc(b.text)+'$$</div>';else if(t==="example")h='<div class="example"><h3>'+esc(b.title||"مثال")+'</h3><p>'+esc(b.text)+'</p><h4>الحل والتفسير</h4><p>'+esc(b.solution)+'</p></div>';else if(t==="callout")h='<div class="callout">'+esc(b.text)+'</div>';else if(t==="list")h="<ul>"+(b.items||[]).map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";else if(t==="image"){try{const u=new URL(b.url);if(u.protocol==="https:")h='<figure><img loading="lazy" src="'+esc(u.href)+'" alt="'+esc(b.caption)+'"><figcaption>'+esc(b.caption)+'</figcaption></figure>'}catch{}}else if(t==="video"){const u=videoUrl(b.url);if(u)h='<h3>'+esc(b.caption||"فيديو")+'</h3><iframe loading="lazy" src="'+esc(u)+'" title="'+esc(b.caption||"فيديو")+'" allowfullscreen></iframe>'}else if(t==="file"){try{const u=new URL(b.url);if(u.protocol==="https:")h='<a class="btn" target="_blank" rel="noopener" href="'+esc(u.href)+'">'+esc(b.caption||"فتح الملف")+'</a>'}catch{}}else if(t==="table"){const rows=b.rows||[];h="<h3>"+esc(b.caption||"جدول")+"</h3><div style='overflow:auto'><table>"+rows.map((r,i)=>"<tr>"+r.map(c=>i===0?"<th>"+esc(c)+"</th>":"<td>"+esc(c)+"</td>").join("")+"</tr>").join("")+"</table></div>"}else if(t==="graph"){const pts=(b.points||[]).filter(p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite));if(pts.length>1){const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys),px=x=>40+(x-xmin)/(xmax-xmin||1)*420,py=y=>220-(y-ymin)/(ymax-ymin||1)*180;h="<h3>"+esc(b.caption||"رسم بياني")+'</h3><svg class="chart" viewBox="0 0 500 260" role="img" aria-label="'+esc(b.caption||"رسم بياني")+'"><path d="M40 20 V220 H470" fill="none" stroke="#a9bfd2"/><polyline points="'+pts.map(p=>px(p[0])+","+py(p[1])).join(" ")+'" fill="none" stroke="#42d6e8" stroke-width="3"/>'+pts.map(p=>"<circle cx='"+px(p[0])+"' cy='"+py(p[1])+"' r='4' fill='#f4c45e'/>").join("")+"</svg><p class='muted'>"+esc(b.xLabel||"X")+" · "+esc(b.yLabel||"Y")+"</p>"}}else if(t==="simulation")h='<div class="simulation"><h3>'+esc(b.title||"محاكاة")+'</h3><p>'+esc(b.text||"")+'</p><label for="altitude">الارتفاع: <output id="altitudeValue">0</output> متر</label><input id="altitude" type="range" min="0" max="10000" step="100" value="0"><p>الضغط التقريبي: <b id="pressureValue">1013.25 hPa</b></p><small class="muted">نموذج تعليمي للغلاف القياسي؛ لا يستخدم للتنبؤ التشغيلي.</small></div>';else if(t==="question")h='<div class="simulation"><b>'+esc(b.question)+'</b><div>'+(b.options||[]).map((x,j)=>'<button class="option" data-answer="'+j+'" data-ok="'+Number(j===Number(b.answer))+'">'+esc(x)+'</button>').join("")+'</div><p class="muted hidden" data-explain>'+esc(b.explanation||"")+'</p></div>';return h?'<article class="block">'+h+'</article>':""}
function init(){let d;try{d=JSON.parse(localStorage.getItem("msa-lesson-preview-v1")||"null")}catch{}if(!d){$("body").textContent="لا توجد معاينة. ارجع إلى المحرر واضغط معاينة الدرس.";return}$("title").textContent=d.title||"درس جديد";$("summary").textContent=d.summary||"";$("meta").textContent=(d.estimated_minutes||"—")+" دقيقة · "+({beginner:"مبتدئ",intermediate:"متوسط",advanced:"متقدم"}[d.level]||"");let goals=d.learning_objectives||[];let html=goals.length?"<h2>الأهداف التعليمية</h2><ul>"+goals.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>":"";html+=(d.content?.blocks||[]).map(block).join("");$("body").innerHTML=html||"لم تتم إضافة محتوى بعد.";if(window.renderMathInElement)renderMathInElement($("body"),{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\(",right:"\\)",display:false}],throwOnError:false})}
$("body").addEventListener("input",e=>{if(e.target.id!=="altitude")return;const h=Number(e.target.value),p=1013.25*Math.pow(1-2.25577e-5*h,5.25588);$("altitudeValue").textContent=h.toLocaleString("en-US");$("pressureValue").textContent=p.toFixed(1)+" hPa"});
$("body").addEventListener("click",e=>{const b=e.target.closest("[data-answer]");if(!b)return;const parent=b.parentElement;if(parent.dataset.done)return;parent.dataset.done="1";const ok=b.dataset.ok==="1";b.classList.add(ok?"correct":"wrong");if(!ok)parent.querySelector('[data-ok="1"]')?.classList.add("correct");const x=b.closest(".simulation").querySelector("[data-explain]");x.classList.remove("hidden");x.textContent=(ok?"إجابة صحيحة. ":"راجع الشرح. ")+x.textContent});
init();
</script></body></html>
