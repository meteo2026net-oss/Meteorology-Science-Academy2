<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><rect width="900" height="400" rx="18" fill="#102137"/><text x="450" y="42" fill="#edf6ff" font-size="25" text-anchor="middle" font-family="Arial">Forecast rainfall accumulation by 6-hour period</text><path d="M140 310V90M140 310H800" stroke="#a9bfd2" stroke-width="2" fill="none"/><g stroke="#29445d"><path d="M140 250H800M140 190H800M140 130H800"/></g><g fill="#42d6e8"><rect x="230" y="270" width="110" height="40" rx="8"/><rect x="445" y="130" width="110" height="180" rx="8"/><rect x="660" y="250" width="110" height="60" rx="8"/></g><g fill="#edf6ff" font-family="Arial" font-size="20" text-anchor="middle"><text x="285" y="252">4 mm</text><text x="500" y="112">18 mm</text><text x="715" y="232">6 mm</text><text x="285" y="345">00–06 UTC</text><text x="500" y="345">06–12 UTC</text><text x="715" y="345">12–18 UTC</text></g><text x="450" y="385" fill="#a9bfd2" font-size="14" text-anchor="middle" font-family="Arial">Illustrative accumulated rainfall, not a deterministic warning</text></svg>